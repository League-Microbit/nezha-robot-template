# Release: builds the project through MakeCode's cloud compile service and
# publishes the resulting .hex as a GitHub Release, so the firmware can be
# flashed from anywhere without a local toolchain.
#
# WHAT THIS IMAGE IS: the CALIBRATION image for the fleet -- the hex carrying
# the calwheels/calturn routines students run to measure a robot's wheel travel
# and effective track width. It is deliberately NOT robot-specific: one image
# runs on any Nezha board, and the numbers it reports are what get written back
# into that robot's own config.
#
# The verb names have now been renamed twice (calx/cala, then calj/calc, now
# calwheels/calturn). They are quoted in the RELEASE NOTES below, which is what
# a student reads to know what to run -- rename them here in the same commit
# that renames them in src/, or a release ships instructions for verbs that
# no longer exist.
#
# So the build stamps `calibration-<version>` into the extension's kProfile
# (scripts/bake-profile.sh), and every released board answers the wire `ID`
# verb with the exact image it is running:
#
#     id diffdrive calibration-0.20260907.1 <ext version> <board name>
#
# The version rides in the PROFILE rather than kVersion because kVersion
# belongs to the extension -- upstream bakes its own release version there in
# tools/publish_extension.py -- and this image's version has nowhere else to
# go. Profile is build provenance, which is exactly what a calibration image's
# version is.
#
# Triggers
#   push to master  -> builds and cuts a dated release, v0.YYYYMMDD.N
#   push of a v* tag -> builds and releases under that exact tag
#   manual dispatch  -> same as a master push
#
# The .hex is also uploaded as a workflow artifact on every run, so a failed
# release step still leaves you something to download.
#
# V2-only — the DiffDrive extension only supports the micro:bit V2 (mbcodal)
# variant, which is what PXT_COMPILE_SWITCHES selects.
name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

# gh release create needs write access to the repo's contents.
permissions:
  contents: write

# Two releases racing for the same dated tag would collide on the version
# probe below, so serialize them.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the build stamps the commit, and the version
          # probe needs to see tags that already exist.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci pins pxt and pxt-microbit to package-lock.json, so a release
      # built today and one built next month use the same compiler.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npx pxt target microbit
          npx pxt install

      # The calibration image enables only flash-backed credentials. No WiFi
      # password is compiled into the public release; provision after flashing.
      # BEFORE the build, not after: kProfile is a compile-time constant, so
      # the version has to be known while the C++ is still being compiled.
      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"
          else
              # Same scheme the DiffDrive extension uses: v0.<UTC date>.<n>,
              # where n counts releases already cut today.
              DATE="$(date -u +%Y%m%d)"
              N=1
              while gh release view "v0.$DATE.$N" >/dev/null 2>&1; do
                  N=$((N + 1))
              done
              TAG="v0.$DATE.$N"
          fi
          # Drop the tag's leading `v` for the baked value: `v` is a git tag
          # convention, and this is a value on the wire. Matches the shape
          # upstream bakes into kVersion (`0.YYYYMMDD.n`, no v).
          PROFILE="calibration-${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          echo "hex=nezha-robot-template-$TAG.hex" >> "$GITHUB_OUTPUT"
          echo "Building $TAG as profile $PROFILE"

      - name: Build
        run: bash scripts/build.sh --cloud --profile "${{ steps.version.outputs.profile }}"

      # The bake is the one part of this build that can fail SILENTLY: if
      # protocol.cpp changes shape upstream, the substitution stops matching
      # and the hex ships reporting `unbaked` with nothing else going wrong.
      # bake-profile.sh already exits non-zero on that, and build.sh reads the
      # value back out of the source -- this asserts the result reached the
      # artefact, so a release can never carry an unstamped or stale profile.
      - name: Verify the baked profile
        env:
          WANT: ${{ steps.version.outputs.profile }}
        run: |
          set -euo pipefail
          GOT="$(cat built/.baked-profile)"
          if [ "$GOT" != "$WANT" ]; then
              echo "::error::hex was built with profile '$GOT', expected '$WANT'"
              exit 1
          fi
          echo "Baked profile verified: $GOT"

      # Every release carries the SAME image under two names, plus a
      # manifest:
      #
      #   nezha-robot-template-<TAG>.hex  the name the release notes tell a
      #                                   student to download and drag onto
      #                                   the MICROBIT drive -- self-describing
      #                                   once it is sitting in ~/Downloads
      #                                   next to five other .hex files.
      #   MICROBIT.hex                    the fixed name robot-console's host
      #                                   resolves by
      #                                   (packages/host/src/releases.ts,
      #                                   HEX_ASSET_NAME), the same convention
      #                                   microbit-radio-relay publishes.
      #   MICROBIT.hex.txt                that host's sha256 manifest. Without
      #                                   it the console has nothing to verify
      #                                   the download against and refuses the
      #                                   release outright.
      #
      # Two names for one file is cheap; a console that cannot flash the
      # calibration image is not. Do not drop either.
      - name: Package the hex
        env:
          HEX: ${{ steps.version.outputs.hex }}
          PROFILE: ${{ steps.version.outputs.profile }}
        run: |
          set -euo pipefail
          cp built/binary.hex "$HEX"
          cp built/binary.hex MICROBIT.hex
          EXT="$(node -e 'process.stdout.write(require("./pxt.json").dependencies["nezha-diffdrive"])')"
          {
              echo "commit: $GITHUB_SHA"
              echo "built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "sha256: $(sha256sum MICROBIT.hex | cut -d' ' -f1)"
              echo "profile: $PROFILE"
              echo "extension: $EXT"
          } > MICROBIT.hex.txt
          cat MICROBIT.hex.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}
          path: |
            ${{ steps.version.outputs.hex }}
            MICROBIT.hex
            MICROBIT.hex.txt
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          HEX: ${{ steps.version.outputs.hex }}
          PROFILE: ${{ steps.version.outputs.profile }}
        run: |
          set -euo pipefail
          EXT="$(node -e 'process.stdout.write(require("./pxt.json").dependencies["nezha-diffdrive"])')"
          {
              echo "The **calibration image** — micro:bit **V2** firmware carrying the"
              echo "\`calwheels\` and \`calturn\` routines for measuring a robot's wheel"
              echo "travel and effective track width. One image runs on any Nezha board."
              echo
              echo "To flash: download \`$HEX\`, plug the micro:bit in over USB, and"
              echo "drag the file onto the \`MICROBIT\` drive."
              echo
              echo "\`MICROBIT.hex\` is the same image under the fixed name the robot"
              echo "console fetches by, and \`MICROBIT.hex.txt\` is its sha256 manifest."
              echo "Flashing by hand? Take \`$HEX\`."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Profile on the wire | \`$PROFILE\` |"
              echo "| Commit | \`$GITHUB_SHA\` |"
              echo "| DiffDrive extension | \`$EXT\` |"
              echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
              echo
              echo "Ask a flashed board what it is running with \`mbdeploy connect <board> ID\`;"
              echo "the second field is the profile above."
              echo
              echo "The robot answers on the **radio**, on the channel and group its own name"
              echo "derives: channel 11 + n % 73, group 15 + n % 241 (radio-robot-lib"
              echo "\`docs/design/radio-addressing.md\`). Tune a relay with \`!N <name>\`."
              echo
              echo "WiFi uses only flash-backed credentials. After flashing, provision the"
              echo "board over USB or radio with \`WIFICRED SET\`, then reset it and verify"
              echo "discovery with \`rogo --discover <board>\`. Flashing erases stored credentials."
          } > notes.md

          # --target: on a tag push the tag already exists and this is a no-op;
          # on a master push it creates the tag at this commit.
          gh release create "$TAG" "$HEX" MICROBIT.hex MICROBIT.hex.txt \
              --title "$TAG" \
              --notes-file notes.md \
              --target "$GITHUB_SHA"
